# Launcher icon generation: dart run flutter_launcher_icons
# Source art is generated (tool script in the Phase F commit): forest
# green #2F5D3A ground, a trail signpost over a ball hitch.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#2F5D3A"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 26
