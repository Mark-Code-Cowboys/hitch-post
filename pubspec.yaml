name: hitch_post
description: "Hitch Post — a private, on-device journal. © Code Cowboys LLC."
publish_to: 'none'
version: 1.0.0+1

environment:
  # Matches cc_core's floor — every CC app builds with the SDK its
  # codemagic.yaml pins (see the per-app-flutter-sdks note in cc_core).
  sdk: ^3.12.2

dependencies:
  cc_core:
    git:
      url: https://github.com/Mark-Code-Cowboys/cc_core.git
      ref: v0.21.2
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  # CSV file picking for the spreadsheet import (same pin as Course
  # Ledger, approved there for the same feature).
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  # The pin map (opt-in campground pins; tiles from OpenStreetMap).
  flutter_map: ^8.2.2
  flutter_riverpod: ^3.4.2
  latlong2: ^0.9.1
  # Journal photo capture (composer strip) + app documents dir.
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  # Export/backup share sheet (same pin as Course Ledger, approved
  # there for the same feature).
  share_plus: ^13.3.0
  stream_transform: ^2.1.1

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
